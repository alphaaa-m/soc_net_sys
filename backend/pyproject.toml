[project]
name = "chirp-backend"
version = "0.1.0"
description = "Chirp — text-only social network API (Phase 0 baseline)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags FastAPI's idiomatic `Depends(...)` in defaults — false positive here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated artefacts; long lines are fine.
"migrations/**" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
