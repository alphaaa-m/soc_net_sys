name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Lint (ruff)
        run: uv run ruff check app tests scripts create_tables.py migrations
        working-directory: backend
      - name: Tests (pytest)
        run: uv run pytest -q
        working-directory: backend
